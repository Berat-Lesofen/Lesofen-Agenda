<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#182032" />
      <stop offset="100%" stop-color="#08090c" />
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#252e42" stroke-width="4" opacity="0.6" />

  <!-- Inner Calendar Silhouette -->
  <g transform="translate(96, 96)">
    <!-- Calendar Body -->
    <rect x="0" y="48" width="320" height="256" rx="28" fill="#0d1017" stroke="#1e2433" stroke-width="6" />
    
    <!-- Calendar Top Bar -->
    <path d="M 0 76 C 0 60, 12 48, 28 48 L 292 48 C 308 48, 320 60, 320 76 L 320 108 L 0 108 Z" fill="#121620" />
    
    <!-- Calendar Ring Hooks -->
    <rect x="64" y="24" width="20" height="48" rx="10" fill="url(#amberGrad)" filter="url(#glow)" />
    <rect x="236" y="24" width="20" height="48" rx="10" fill="url(#amberGrad)" filter="url(#glow)" />

    <!-- Grid Dots / Cells -->
    <rect x="44" y="140" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="108" y="140" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="172" y="140" width="44" height="28" rx="8" fill="url(#cyanGrad)" />
    <rect x="236" y="140" width="44" height="28" rx="8" fill="#1b2232" />

    <rect x="44" y="188" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="108" y="188" width="44" height="28" rx="8" fill="url(#amberGrad)" filter="url(#glow)" />
    <rect x="172" y="188" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="236" y="188" width="44" height="28" rx="8" fill="#1b2232" />

    <rect x="44" y="236" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="108" y="236" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="172" y="236" width="44" height="28" rx="8" fill="#1b2232" />
    <rect x="236" y="236" width="44" height="28" rx="8" fill="#10b981" />
  </g>
</svg>
